name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Only the test-time deps: the core demo is stdlib-only, the LLM router is
      # exercised with a stub, and the server test needs fastapi + httpx.
      - name: Install test dependencies
        run: pip install --upgrade pip pytest fastapi "uvicorn[standard]" httpx

      - name: Run the test suite
        run: pytest -q
